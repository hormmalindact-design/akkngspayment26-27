<!-- API Logic -->
    <script>
      // ⚠️ សូម Paste Link API_URL ដែល Copy ពី index.html មកដាក់នៅទីនេះ ⚠️
      const API_URL = "https://script.google.com/macros/s/AKfycbw4KrJEI2QWsgNKr-fbIt3iCU_-RPUaDkhk_9DKjlX8jOGWEBNddFPYftyblqdn2N7Q/exec"; 
      
      var allClassData = null; 
      var currentStudentId = null;

      window.onload = function() {
        refreshDashboard();
        loadClassData();
      };

      function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(el => {
          el.classList.remove('text-blue-600', 'text-indigo-600');
          el.classList.add('text-gray-400');
          el.querySelector('span').classList.add('opacity-80');
        });
        var activeBtn = document.getElementById('btn-' + tabName);
        activeBtn.classList.remove('text-gray-400');
        activeBtn.classList.add(tabName === 'class' ? 'text-indigo-600' : 'text-blue-600');
        activeBtn.querySelector('span').classList.remove('opacity-80');
      }

      function refreshDashboard() {
        // 💡 ថែម &t= ទីនេះ
        fetch(`${API_URL}?action=getTeacherDashboardData&t=${new Date().getTime()}`)
          .then(res => res.json())
          .then(data => {
            if (data.status === "error") {
               alert("មានកំហុសពី Backend: " + data.message + "\nសូមប្រាកដថាបាន Deploy កូដជា New Version!");
               return;
            }
            // បង្ហាញទិន្នន័យ ព្រមទាំងភ្ជាប់ពាក្យ "នាក់" និង "KHR"
            document.getElementById('dashTotalPaid').innerText = (data.totalPaidStudents || 0) + " នាក់";
            document.getElementById('dashFemalePaid').innerText = (data.totalFemalePaid || 0) + " នាក់";
            document.getElementById('dashCollected').innerText = Number(data.totalCollected || 0).toLocaleString() + " KHR";
          })
          .catch(err => {
            console.error(err);
            alert("មិនអាចភ្ជាប់ទៅកាន់ទិន្នន័យបានទេ! សូមពិនិត្យមើល API_URL នៅក្នុង mobile.html របស់អ្នក។");
          });
      }

      function loadClassData() {
        // 💡 ថែម &t= ទីនេះ
        fetch(`${API_URL}?action=getClassMonitoringData&t=${new Date().getTime()}`)
          .then(res => res.json())
          .then(data => {
            if (data.status === "error") return;
            allClassData = data;
            var selector = document.getElementById('classSelector');
            selector.innerHTML = '<option value="">ជ្រើសរើសថ្នាក់រៀន...</option>'; // Reset មុននឹងបញ្ជូលថ្មី
            var classes = Object.keys(data).sort(); 
            classes.forEach(cls => {
              selector.innerHTML += `<option value="${cls}">ថ្នាក់ទី ${cls}</option>`;
            });
          });
      }

      function renderClassList() {
        var cls = document.getElementById('classSelector').value;
        var resultArea = document.getElementById('classResultArea');
        var listContainer = document.getElementById('classListContainer');
        
        if (!cls) { resultArea.style.display = 'none'; return; }
        
        var students = allClassData[cls] || [];
        var paidCount = 0; var unpaidCount = 0;
        listContainer.innerHTML = '';
        
        students.forEach((stu, index) => {
          var isFullyPaid = (stu.status === "Paid" && stu.remaining === 0);
          if (isFullyPaid) paidCount++; else unpaidCount++; 
          
          var badge = isFullyPaid 
            ? '<span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-lg text-[9px] font-black">បង់ដាច់</span>'
            : '<span class="bg-red-100 text-red-600 px-2.5 py-1 rounded-lg text-[9px] font-black">ជំពាក់</span>';
            
          var card = `
            <div class="p-3 bg-white rounded-2xl shadow-sm border border-slate-100 mb-3">
              <div class="flex justify-between items-start border-b border-gray-50 pb-2 mb-2">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xs">${index + 1}</div>
                  <div>
                    <p class="text-xs font-bold text-slate-800">${stu.name}</p>
                    <p class="text-[9px] text-gray-500 mt-0.5">ភេទ៖ <span class="font-semibold">${stu.gender}</span></p>
                  </div>
                </div>
                <div>${badge}</div>
              </div>
              <div class="grid grid-cols-3 gap-2 text-center text-[10px]">
                <div class="bg-slate-50 rounded-lg p-1.5 border border-slate-100">
                  <span class="text-gray-400 block mb-0.5 text-[8px]">តម្លៃសិក្សា</span>
                  <span class="font-bold text-slate-700">${Number(stu.fullFee).toLocaleString()}</span>
                </div>
                <div class="bg-emerald-50 rounded-lg p-1.5 border border-emerald-100">
                  <span class="text-emerald-500 block mb-0.5 text-[8px]">បានបង់</span>
                  <span class="font-bold text-emerald-700">${Number(stu.paidAmt).toLocaleString()}</span>
                </div>
                <div class="bg-red-50 rounded-lg p-1.5 border border-red-100">
                  <span class="text-red-400 block mb-0.5 text-[8px]">នៅខ្វះ</span>
                  <span class="font-bold text-red-600">${Number(stu.remaining).toLocaleString()}</span>
                </div>
              </div>
            </div>`;
          listContainer.innerHTML += card;
        });
        
        document.getElementById('lblClassTotal').innerText = students.length;
        document.getElementById('lblClassPaid').innerText = paidCount;
        document.getElementById('lblClassUnpaid').innerText = unpaidCount;
        resultArea.style.display = 'block';
      }

      function searchStudent() {
        var id = document.getElementById('searchId').value.trim();
        if(!id) return alert('សូមបញ្ចូលលេខកូដសិស្ស!');
        var msgDiv = document.getElementById('msg');
        document.getElementById('historyTableArea').style.display = 'none';
        msgDiv.className = "p-3 rounded-xl text-center text-xs font-bold bg-blue-100 text-blue-800 block";
        msgDiv.innerText = 'កំពុងស្វែងរក...';
        document.getElementById('studentCard').style.display = 'none';
        
        // 💡 ថែម &t= ទីនេះ
        fetch(`${API_URL}?action=getStudentById&studentId=${id}&t=${new Date().getTime()}`)
          .then(res => res.json())
          .then(student => {
            if(student && student.id) {
              currentStudentId = student.id;
              document.getElementById('lblName').innerText = student.name;
              document.getElementById('lblType').innerText = student.type;
              document.getElementById('lblAmount').innerText = Number(student.amount).toLocaleString() + " ៛";
              var rem = (Number(student.fullFee)||0) - (Number(student.amount)||0);
              if(rem < 0) rem = 0;
              document.getElementById('lblRemaining').innerText = rem.toLocaleString() + " ៛";
              
              var statusLbl = document.getElementById('lblStatus');
              if (rem === 0) {
                statusLbl.innerText = "បានបង់ដាច់";
                statusLbl.className = "px-3 py-1 rounded-lg text-[10px] font-black bg-emerald-100 text-emerald-700";
              } else {
                statusLbl.innerText = "នៅខ្វះប្រាក់";
                statusLbl.className = "px-3 py-1 rounded-lg text-[10px] font-black bg-red-100 text-red-600";
              }
              document.getElementById('studentCard').style.display = 'block';
              msgDiv.style.display = 'none';
            } else {
              msgDiv.className = "p-3 rounded-xl text-center text-xs font-bold bg-red-100 text-red-800 block";
              msgDiv.innerText = 'រកមិនឃើញកូដសិស្សនេះទេ!';
            }
          });
      }

      function viewHistory() {
        if (!currentStudentId) return;
        var tbody = document.getElementById('historyTbody');
        document.getElementById('historyTableArea').style.display = 'block';
        tbody.innerHTML = '<tr><td class="p-2 text-center text-gray-400">កំពុងទាញយក...</td></tr>';
        
        // 💡 ថែម &t= ទីនេះ
        fetch(`${API_URL}?action=getStudentHistoryLog&studentId=${currentStudentId}&t=${new Date().getTime()}`)
          .then(res => res.json())
          .then(historyData => {
            tbody.innerHTML = '';
            if (!historyData || historyData.length === 0) return tbody.innerHTML = '<tr><td class="p-2 text-center text-amber-600">គ្មានប្រវត្តិ</td></tr>';
            historyData.forEach(record => {
              tbody.innerHTML += `<tr><td class="py-2 text-gray-400">${record.date}</td><td class="py-2 text-blue-700 font-bold">${record.phase}</td><td class="py-2 text-emerald-600 font-bold text-right">${Number(record.amount).toLocaleString()} ៛</td></tr>`;
            });
          });
      }
    </script>
